{% extends "blog/base.html" %}
{% load static %}

{% block content %}

<section class="latest-posts">

    <h1 class="page-title">

        Llistat de tots els posts

    </h1>
    <div class="all-posts-container">

        {% for post in all_posts %}

        <div class="post-card">

            <img src="{% static 'blog/imatges/images.png' %}">

            <div class="post-content">

                <a href="{% url 'post-detail-page' post.slug %}">
                    <h3>{{ post.title }}</h3>
                </a>

                <p>{{ post.excerpt }}</p>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
