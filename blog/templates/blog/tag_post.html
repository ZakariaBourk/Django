{% extends "blog/base.html" %}
{% load static %}

{% block content %}

<h1 class="h1-liista-tag">

    Llistat de tots els posts amb l'etiqueta

    <u>{{ tag.caption }}</u>

</h1>

<div class="post-grid">

    {% for post in posts %}

    <div class="post-card">

        <img src="{% static 'blog/imatges/'|add:post.image_name %}">

        <div class="post-card-content">

            <h3>{{ post.title }}</h3>

            <p>{{ post.excerpt }}</p>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
