{% extends "blog/base.html" %}
{% load static %}

{% block content %}

<section class="post-detail">

    <h1>{{ post.title }}</h1>

    <p class="post-meta">

        {{ post.date }} -

        <a href="/authors/{{ post.author.id }}">

            {{ post.author }}

        </a>

    </p>

    <img 
        src="{% static 'blog/imatges/'|add:post.image_name %}" 
        class="detail-image"
    >

    <p class="post-text">

        {{ post.content }}

    </p>

    <h2>Etiquetes</h2>

    {% for tag in post.tags.all %}

        <a href="/tags/{{ tag.id }}">

            {{ tag.caption }}

        </a>

    {% endfor %}

</section>

{% endblock %}
