name: Generate Pydoc

on:
  push:
    branches:
      - main

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install django

      - name: Generar documentació
        working-directory: MY_SITE
        run: |
          mkdir docs

          export PYTHONPATH=$PWD

          python -m pydoc -w blog.models
          python -m pydoc -w blog.views


          mv *.html docs/

      - name: Publicar GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./MY_SITE/.github/workflows